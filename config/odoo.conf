[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
; Required in every environment (local dev, staging, production).
; Registers POST /envia/integration/callback before Odoo picks a database.
; Keep envia out of this list so the main module stays uninstallable from Apps.
server_wide_modules = web,base,envia_http
